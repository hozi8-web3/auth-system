# ============================================
# DEVELOPMENT DOCKER COMPOSE
# ============================================
# Usage: docker-compose up -d
# ============================================

version: '3.8'

services:
  # ----------------------------------------
  # API Server
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: auth-api-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./src:/app/src
      - ./keys:/app/keys
      - ./prisma:/app/prisma
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-auth_db}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    networks:
      - auth-network

  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-auth_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  # ----------------------------------------
  # Redis Cache
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auth-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  # ----------------------------------------
  # Prisma Studio (Database GUI)
  # ----------------------------------------
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: auth-prisma-studio
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-auth_db}?schema=public
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      - postgres
    networks:
      - auth-network

volumes:
  postgres-data:
  redis-data:

networks:
  auth-network:
    driver: bridge
